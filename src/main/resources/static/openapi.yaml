                    featureKey: "ORDER_DETAIL"
                    featureName: "Chi Tiết Đơn Hàng (Order Detail)"
                    featureDescription: "Cho phép xem thông tin lịch sử và hành trình đơn hàng"
                    masterActive: true
                    isGranted: true
                    grantedAt: "2026-09-03T10:00:00"
                    grantedBy: "admin"
                  - grantId: "501bca23-7453-63f5-1043-decf214365ac"
                    featureId: "ad911030-20c9-439b-a92c-f41d75f34867"
                    featureKey: "PRICE_INCREASE"
                    featureName: "Tăng Giá Tự Động (Price Increase)"
                    featureDescription: "Tính năng điều chỉnh giá sản phẩm tự động"
                    masterActive: true
                    isGranted: false
                    grantedAt: null
                    grantedBy: null
                  - grantId: "612cdb34-8564-74a6-2154-efda325476bd"
                    featureId: "faa28083-7c13-4a8b-a595-09885b21f3cd"
                    featureKey: "COUPON_DISCOUNT"
                    featureName: "Mã Giảm Giá (Coupon Discount)"
                    featureDescription: "Cho phép nhập và áp dụng mã voucher"
                    masterActive: true
                    isGranted: true
                    grantedAt: "2026-09-03T10:00:00"
                    grantedBy: "admin"
                timestamp: "2026-09-03T17:30:00"

  /api/v1/admin/tenants/{tenantCode}/grants/toggle:
    post:
      tags:
        - "4. Tenant Feature Grants"
      summary: "Bật / Tắt cấp quyền 1 cờ cụ thể cho Tenant (Ghi Audit Log)"
      description: "Super Admin cấp phép (`GRANT`) hoặc thu hồi (`REVOKE`) quyền dùng 1 cờ tính năng cho khách hàng."
      security:
        - BearerAuth: []
      parameters:
        - name: tenantCode
          in: path
          required: true
          schema:
            type: string
          example: "COMPANY_A"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantGrantToggleReq'
            example:
              featureKey: "PRICE_INCREASE"
              isGranted: true
              performedBy: "admin"
      responses:
        '200':
          description: "Cập nhật phân quyền thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTenantGrantRes'
              example:
                success: true
                message: "Cập nhật phân quyền cờ thành công"
                data:
                  grantId: "501bca23-7453-63f5-1043-decf214365ac"
                  featureId: "ad911030-20c9-439b-a92c-f41d75f34867"
                  featureKey: "PRICE_INCREASE"
                  featureName: "Tăng Giá Tự Động (Price Increase)"
                  featureDescription: "Tính năng điều chỉnh giá sản phẩm tự động"
                  masterActive: true
                  isGranted: true
                  grantedAt: "2026-09-03T17:30:00"
                  grantedBy: "admin"
                timestamp: "2026-09-03T17:30:00"

  /api/v1/admin/tenants/{tenantCode}/grants/batch:
