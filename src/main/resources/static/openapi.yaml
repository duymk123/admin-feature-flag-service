openapi: 3.0.3
info:
  title: "Admin Feature Flag Service API"
  description: |
    # 🚩 Hệ Thống Quản Trị & Phân Quyền Feature Flag Tập Trung
    
    API dành cho **Super Admin** quản lý danh mục cờ toàn cục (Master Features), danh sách các Tenant/Khách hàng (Company A, Company B), và phân quyền cờ cho từng Tenant.
    
    ---
    ### 🔐 Thông Tin Đăng Nhập Mặc Định
    - **Tài khoản**: `admin`
    - **Mật khẩu**: `1`
    - Sau khi gọi API `/api/v1/auth/login`, lấy `token` dán vào nút **Authorize 🔓** (Bearer Token) để thực thi các API cần quyền quản trị.
  version: "1.0.0"
  contact:
    name: "Viettel Software Development Team"
    email: "admin@viettel.com.vn"

servers:
  - url: "http://localhost:8084"
    description: "Local Docker Server (Port 8084)"
  - url: "http://admin-feature-flag-service:8082"
    description: "Docker Internal Network (Port 8082)"

tags:
  - name: "1. Authentication"
    description: "Xác thực tài khoản và cấp phiên đăng nhập Super Admin"
  - name: "2. Master Features"
    description: "Quản lý danh mục cờ toàn hệ thống (Super Admin)"
  - name: "3. Tenants Management"
    description: "Quản lý danh sách các công ty / Instance khách hàng"
  - name: "4. Tenant Feature Grants"
    description: "Phân quyền cấp phép tính năng (Feature Flags) cho từng Tenant"
  - name: "5. Internal Integration API"
    description: "Endpoint nội bộ dành riêng cho feature-flag-service truy vấn danh sách cờ được cấp"
  - name: "6. Audit Logs"
    description: "Lịch sử chi tiết mọi thao tác cấp/thu hồi cờ của Super Admin"
  - name: "7. Sync & Apply"
    description: "Đồng bộ dữ liệu sang Feature-Flag-Service và đẩy snapshot cấu hình sang Tracking-Order"

paths:
  # ========================================================
  # 1. AUTHENTICATION
  # ========================================================
  /api/v1/auth/login:
    post:
      tags:
        - "1. Authentication"
      summary: "Đăng nhập Super Admin"
      description: "Đăng nhập với tài khoản cố định `admin / 1` để nhận Bearer session token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "admin"
              password: "1"
      responses:
        '200':
          description: "Đăng nhập thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLoginResponse'
              example:
                success: true
                message: "Đăng nhập thành công!"
                data:
                  token: "admin-session-65da81c9-7ab4-4281-8a7c-e3eb5bd5d296"
                  tokenType: "Bearer"
                  username: "admin"
                  role: "SUPER_ADMIN"
                timestamp: "2026-09-03T17:30:00"

  # ========================================================
  # 2. MASTER FEATURES
  # ========================================================
  /api/v1/admin/master-features:
    get:
      tags:
        - "2. Master Features"
      summary: "Lấy danh sách tất cả Master Features"
      description: "Trả về toàn bộ danh mục cờ tính năng hiện có trong toàn hệ thống."
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Danh sách Master Features"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListMasterFeatureRes'
              example:
                success: true
                message: "Success"
                data:
                  - id: "855626df-9be2-4d71-98dd-b45cf8e8b219"
                    featureKey: "BUY_NOW"
                    name: "Mua Ngay (Buy Now)"
                    description: "Cho phép hiển thị nút Mua Ngay và đặt hàng nhanh không cần qua giỏ hàng"
                    isActive: true
                    createdAt: "2026-09-03T10:00:00"
                    updatedAt: "2026-09-03T10:00:00"
                  - id: "db4fa862-7706-47a2-8fff-fbcb81d7b908"
                    featureKey: "ORDER_DETAIL"
                    name: "Chi Tiết Đơn Hàng (Order Detail)"
                    description: "Cho phép xem thông tin lịch sử và hành trình chi tiết của đơn hàng"
                    isActive: true
                    createdAt: "2026-09-03T10:00:00"
                    updatedAt: "2026-09-03T10:00:00"
                  - id: "ad911030-20c9-439b-a92c-f41d75f34867"
                    featureKey: "PRICE_INCREASE"
                    name: "Tăng Giá Tự Động (Price Increase)"
                    description: "Tính năng điều chỉnh giá sản phẩm tự động theo chiến dịch"
                    isActive: true
                    createdAt: "2026-09-03T10:00:00"
                    updatedAt: "2026-09-03T10:00:00"
                  - id: "faa28083-7c13-4a8b-a595-09885b21f3cd"
                    featureKey: "COUPON_DISCOUNT"
                    name: "Mã Giảm Giá (Coupon Discount)"
                    description: "Cho phép nhập và áp dụng mã voucher khi thanh toán đơn hàng"
                    isActive: true
                    createdAt: "2026-09-03T10:00:00"
                    updatedAt: "2026-09-03T10:00:00"
                timestamp: "2026-09-03T17:30:00"
    post:
      tags:
        - "2. Master Features"
      summary: "Tạo Master Feature mới"
      description: "Thêm một cờ tính năng mới vào hệ thống quản trị."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterFeatureReq'
            example:
              featureKey: "FLASH_SALE"
              name: "Giảm Giá Sốc (Flash Sale)"
              description: "Hiển thị đồng hồ đếm ngược và bảng giá flash sale đặc biệt"
              isActive: true
      responses:
        '201':
          description: "Tạo Master Feature thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMasterFeatureRes'
              example:
                success: true
                message: "Tạo Master Feature thành công"
                data:
                  id: "e481b992-11da-45c1-9abc-0129bc8112ae"
                  featureKey: "FLASH_SALE"
                  name: "Giảm Giá Sốc (Flash Sale)"
                  description: "Hiển thị đồng hồ đếm ngược và bảng giá flash sale đặc biệt"
                  isActive: true
                  createdAt: "2026-09-03T17:30:00"
                  updatedAt: "2026-09-03T17:30:00"
                timestamp: "2026-09-03T17:30:00"

  /api/v1/admin/master-features/{id}:
    get:
      tags:
        - "2. Master Features"
      summary: "Lấy chi tiết 1 Master Feature theo ID"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "855626df-9be2-4d71-98dd-b45cf8e8b219"
      responses:
        '200':
          description: "Chi tiết Feature"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMasterFeatureRes'
              example:
                success: true
                message: "Success"
                data:
                  id: "855626df-9be2-4d71-98dd-b45cf8e8b219"
                  featureKey: "BUY_NOW"
                  name: "Mua Ngay (Buy Now)"
                  description: "Cho phép hiển thị nút Mua Ngay"
                  isActive: true
                  createdAt: "2026-09-03T10:00:00"
                  updatedAt: "2026-09-03T10:00:00"
                timestamp: "2026-09-03T17:30:00"
    put:
      tags:
        - "2. Master Features"
      summary: "Cập nhật thông tin Master Feature"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "855626df-9be2-4d71-98dd-b45cf8e8b219"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterFeatureReq'
            example:
              featureKey: "BUY_NOW"
              name: "Mua Ngay Nhanh Chóng"
              description: "Cập nhật mô tả mới cho tính năng Mua Ngay"
              isActive: true
      responses:
        '200':
          description: "Cập nhật thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMasterFeatureRes'
              example:
                success: true
                message: "Cập nhật Master Feature thành công"
                data:
                  id: "855626df-9be2-4d71-98dd-b45cf8e8b219"
                  featureKey: "BUY_NOW"
                  name: "Mua Ngay Nhanh Chóng"
                  description: "Cập nhật mô tả mới cho tính năng Mua Ngay"
                  isActive: true
                  createdAt: "2026-09-03T10:00:00"
                  updatedAt: "2026-09-03T17:30:00"
                timestamp: "2026-09-03T17:30:00"
    delete:
      tags:
        - "2. Master Features"
      summary: "Xóa Master Feature theo ID"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "855626df-9be2-4d71-98dd-b45cf8e8b219"
      responses:
        '200':
          description: "Xóa thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
              example:
                success: true
                message: "Xóa Master Feature thành công"
                data: null
                timestamp: "2026-09-03T17:30:00"

  /api/v1/admin/master-features/{id}/toggle:
    patch:
      tags:
        - "2. Master Features"
      summary: "Bật / Tắt nhanh trạng thái hoạt động của Master Feature"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "855626df-9be2-4d71-98dd-b45cf8e8b219"
      responses:
        '200':
          description: "Chuyển trạng thái thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMasterFeatureRes'
              example:
                success: true
                message: "Chuyển trạng thái Master Feature thành công"
                data:
                  id: "855626df-9be2-4d71-98dd-b45cf8e8b219"
                  featureKey: "BUY_NOW"
                  name: "Mua Ngay (Buy Now)"
                  description: "Cho phép hiển thị nút Mua Ngay"
                  isActive: false
                  createdAt: "2026-09-03T10:00:00"
                  updatedAt: "2026-09-03T17:30:00"
                timestamp: "2026-09-03T17:30:00"

  # ========================================================
  # 3. TENANTS MANAGEMENT
  # ========================================================
  /api/v1/admin/tenants:
