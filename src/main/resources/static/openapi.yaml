      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantReq'
            example:
              tenantCode: "COMPANY_C"
              name: "Viettel Commerce - Company C"
