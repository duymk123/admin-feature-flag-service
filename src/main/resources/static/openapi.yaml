  # ========================================================
  # 7. SYNC & APPLY
  # ========================================================
  /api/v1/admin/sync/sync-all-tenants:
    post:
      tags:
        - "7. Sync & Apply"
      summary: "Đồng bộ toàn bộ Tenants và Grants sang Feature-Flag-Service"
      description: "Quét toàn bộ danh sách Tenants và Grants trong Admin DB, tạo/cập nhật Customer và CustomerFeatureFlag tương ứng trong Feature-Flag-Service."
      responses:
        '200':
          description: "Đồng bộ thành công"
          content:
            application/json:
              example:
                status: "SUCCESS"
                totalTenants: 2
                syncedTenants: 2
                failedTenants: 0
                flagsSynced: 4

  /api/v1/admin/sync/apply-all:
    post:
      tags:
        - "7. Sync & Apply"
      summary: "Apply cấu hình toàn bộ Tenants sang Tracking-Order"
      description: "Kích hoạt Feature-Flag-Service đẩy cấu hình snapshot tức thời sang tất cả các instance Tracking-Order (Company A, Company B,...)."
      responses:
        '200':
          description: "Apply thành công"
          content:
            application/json:
              example:
                COMPANY_A:
                  status: "SUCCESS"
                  serviceUrl: "http://tracking-order-a:8080"
                COMPANY_B:
                  status: "SUCCESS"
                  serviceUrl: "http://tracking-order-b:8080"

  /api/v1/admin/sync/apply/{tenantCode}:
    post:
      tags:
        - "7. Sync & Apply"
      summary: "Apply cấu hình cho 1 Tenant sang Tracking-Order"
      description: "Kích hoạt Feature-Flag-Service đẩy cấu hình snapshot chỉ cho instance Tracking-Order của Tenant được chỉ định."
      parameters:
        - name: tenantCode
          in: path
          required: true
          description: "Mã Tenant (VD: COMPANY_A, COMPANY_B)"
          schema:
            type: string
          example: "COMPANY_A"
      responses:
        '200':
          description: "Apply thành công cho Tenant"
          content:
            application/json:
              example:
                status: "SUCCESS"
                serviceUrl: "http://tracking-order-a:8080"
                customerCode: "COMPANY_A"

# ========================================================
# COMPONENTS & SCHEMAS
# ========================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Nhập token nhận được từ API /api/v1/auth/login (VD: admin / 1)"

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "1"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "admin-session-65da81c9-7ab4-4281-8a7c-e3eb5bd5d296"
        tokenType:
          type: string
          example: "Bearer"
        username:
          type: string
          example: "admin"
        role:
          type: string
          example: "SUPER_ADMIN"

    ApiResponseLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Đăng nhập thành công!"
        data:
          $ref: '#/components/schemas/LoginResponse'
        timestamp:
          type: string
          format: date-time

    MasterFeatureReq:
      type: object
      required:
        - featureKey
        - name
      properties:
        featureKey:
          type: string
          example: "BUY_NOW"
        name:
          type: string
          example: "Mua Ngay (Buy Now)"
        description:
          type: string
          example: "Cho phép hiển thị nút Mua Ngay và đặt hàng nhanh"
        isActive:
          type: boolean
          example: true

    MasterFeatureRes:
      type: object
      properties:
        id:
          type: string
          example: "855626df-9be2-4d71-98dd-b45cf8e8b219"
        featureKey:
          type: string
          example: "BUY_NOW"
        name:
          type: string
          example: "Mua Ngay (Buy Now)"
        description:
          type: string
          example: "Cho phép hiển thị nút Mua Ngay"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiResponseMasterFeatureRes:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Success"
        data:
          $ref: '#/components/schemas/MasterFeatureRes'
        timestamp:
          type: string
          format: date-time

