                  - grantId: "389fae01-5231-41d3-9821-bcad092143ea"
                    featureId: "855626df-9be2-4d71-98dd-b45cf8e8b219"
                    featureKey: "BUY_NOW"
                    featureName: "Mua Ngay (Buy Now)"
                    featureDescription: "Cho phép hiển thị nút Mua Ngay và đặt hàng nhanh"
                    masterActive: true
                    isGranted: true
                    grantedAt: "2026-09-03T10:00:00"
                    grantedBy: "admin"
