                success: true
                message: "Success"
                data:
                  - id: "a819b521-12cd-48e2-b33a-969d2d0b5e43"
                    tenantCode: "COMPANY_A"
                    name: "Viettel Software - Company A"
                    ipAddress: "127.0.0.1"
