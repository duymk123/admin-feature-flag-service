  # ========================================================
  # 4. TENANT FEATURE GRANTS
  # ========================================================
  /api/v1/admin/tenants/{tenantCode}/grants:
    get:
      tags:
        - "4. Tenant Feature Grants"
      summary: "Xem danh sách cờ và trạng thái cấp quyền của Tenant"
      description: "Trả về toàn bộ Master Features kèm trạng thái `isGranted: true/false` của Tenant được chỉ định."
      security:
        - BearerAuth: []
      parameters:
        - name: tenantCode
          in: path
          required: true
          schema:
            type: string
          example: "COMPANY_A"
      responses:
        '200':
          description: "Danh sách phân quyền của Tenant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTenantGrantRes'
              example:
                success: true
                message: "Success"
